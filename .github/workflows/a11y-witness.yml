name: a11y-witness

on:
  pull_request:

jobs:
  a11y-witness:
    runs-on: windows-2022        # NVDA is Windows-only; the action fails fast anywhere else
    steps:
      - uses: actions/checkout@v4
      - uses: DanBeckDev/a11y-witness@main
        with:
          url: https://github.com/DanBeckDev/a11y-witness
          task: Understand what this project does
          fail-on: never           # report first; gate when your team asks for it
